server:
  port: 8082
spring:
  application:
    name: restaurant-order-service
  config:
    import: optional:nacos:${spring.application.name}.yml
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/restaurant?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:restaurant}
    password: ${DB_PASSWORD:restaurant}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        file-extension: yml
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  token:
    secret: ${APP_TOKEN_SECRET:shanfang-restaurant-secret-2026}
    ttl-minutes: 720
